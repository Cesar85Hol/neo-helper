<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="600" viewBox="0 0 1840 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/>
    </marker>
    <style>
      .t { font-size: 22px; font-weight: 700; fill: #1f2a33; text-anchor: middle; }
      .y { font-size: 18px; font-weight: 700; fill: #1f2a33; text-anchor: middle; }
      .ink { stroke: #1f2a33; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #ffffff; stroke: #1f2a33; stroke-width: 3; }
      .edge { stroke: #1f2a33; stroke-width: 1.6; opacity: 0.55; }
    </style>
  </defs>

  <rect width="1840" height="600" fill="#fafbfc"/>
  <text x="40" y="60" font-size="30" font-weight="700" fill="#1f2a33">Come cambia il modo di costruire le reti</text>
  <text x="40" y="92" font-size="16" fill="#5b6770">Diagnosi dei nei · 2017 → 2026 · i cerchi tratteggiati sono un'anteprima</text>

  <!-- 1 · 2017 · recycle a pretrained network -->
  <g transform="translate(180,250)">
    <circle r="105" fill="#264653" opacity="0.12"/>
    <g class="edge">
      <line x1="-40" y1="-30" x2="0" y2="-45"/><line x1="-40" y1="-30" x2="0" y2="-15"/><line x1="-40" y1="-30" x2="0" y2="15"/><line x1="-40" y1="-30" x2="0" y2="45"/>
      <line x1="-40" y1="0" x2="0" y2="-45"/><line x1="-40" y1="0" x2="0" y2="-15"/><line x1="-40" y1="0" x2="0" y2="15"/><line x1="-40" y1="0" x2="0" y2="45"/>
      <line x1="-40" y1="30" x2="0" y2="-45"/><line x1="-40" y1="30" x2="0" y2="-15"/><line x1="-40" y1="30" x2="0" y2="15"/><line x1="-40" y1="30" x2="0" y2="45"/>
      <line x1="0" y1="-45" x2="40" y2="-15"/><line x1="0" y1="-15" x2="40" y2="-15"/><line x1="0" y1="15" x2="40" y2="-15"/><line x1="0" y1="45" x2="40" y2="-15"/>
      <line x1="0" y1="-45" x2="40" y2="15"/><line x1="0" y1="-15" x2="40" y2="15"/><line x1="0" y1="15" x2="40" y2="15"/><line x1="0" y1="45" x2="40" y2="15"/>
    </g>
    <g class="node">
      <circle cx="-40" cy="-30" r="8"/><circle cx="-40" cy="0" r="8"/><circle cx="-40" cy="30" r="8"/>
      <circle cx="0" cy="-45" r="8"/><circle cx="0" cy="-15" r="8"/><circle cx="0" cy="15" r="8"/><circle cx="0" cy="45" r="8"/>
      <circle cx="40" cy="-15" r="8" fill="#264653"/><circle cx="40" cy="15" r="8" fill="#264653"/>
    </g>
    <path d="M -62,-62 A 88 88 0 0 1 62,-62" class="ink" marker-end="url(#a)"/>
    <path d="M 62,62 A 88 88 0 0 1 -62,62" class="ink" marker-end="url(#a)"/>
  </g>
  <text x="180" y="400" class="t">Riciclare una rete</text>
  <text x="180" y="428" class="t">già esperta</text>

  <!-- 2 · 2018–19 · dermatoscope -->
  <g transform="translate(476,250)">
    <circle r="105" fill="#2A9D8F" opacity="0.15"/>
    <circle cx="-12" cy="-12" r="50" fill="#f3d6bb"/>
    <path d="M -38,-20 C -36,-44 -6,-46 8,-34 C 26,-22 20,6 2,14 C -14,22 -40,10 -38,-20 z" fill="#7a4a2c"/>
    <circle cx="-18" cy="-20" r="7" fill="#3d2414"/>
    <circle cx="2" cy="-6" r="5" fill="#3d2414"/>
    <path d="M -26,0 C -20,-6 -12,-2 -14,6" fill="none" stroke="#5a8fb0" stroke-width="4" opacity="0.8"/>
    <circle cx="-12" cy="-12" r="50" fill="none" stroke="#1f2a33" stroke-width="9"/>
    <line x1="25" y1="25" x2="68" y2="68" stroke="#1f2a33" stroke-width="16" stroke-linecap="round"/>
  </g>
  <text x="476" y="400" class="t">Specializzarla sul</text>
  <text x="476" y="428" class="t">dermatoscopio</text>

  <!-- 3 · 2018–19 · open data and world challenge -->
  <g transform="translate(772,250)">
    <circle r="105" fill="#C9A227" opacity="0.18"/>
    <g fill="#ffffff" stroke="#1f2a33" stroke-width="2.5">
      <rect x="-58" y="-74" width="22" height="22" rx="4"/><rect x="-30" y="-74" width="22" height="22" rx="4"/><rect x="-2" y="-74" width="22" height="22" rx="4"/><rect x="26" y="-74" width="22" height="22" rx="4"/>
      <rect x="-58" y="-46" width="22" height="22" rx="4"/><rect x="-30" y="-46" width="22" height="22" rx="4"/><rect x="-2" y="-46" width="22" height="22" rx="4"/><rect x="26" y="-46" width="22" height="22" rx="4"/>
    </g>
    <g fill="#7a4a2c">
      <circle cx="-47" cy="-63" r="5"/><circle cx="-19" cy="-63" r="6"/><circle cx="9" cy="-63" r="4"/><circle cx="37" cy="-63" r="6"/>
      <circle cx="-47" cy="-35" r="6"/><circle cx="-19" cy="-35" r="4"/><circle cx="9" cy="-35" r="6"/><circle cx="37" cy="-35" r="5"/>
    </g>
    <g fill="#ffffff" stroke="#1f2a33" stroke-width="3">
      <rect x="-60" y="22" width="38" height="46"/>
      <rect x="-19" y="-4" width="38" height="72" fill="#C9A227"/>
      <rect x="22" y="36" width="38" height="32"/>
    </g>
    <text x="0" y="30" font-size="26" font-weight="700" fill="#1f2a33" text-anchor="middle">1</text>
    <text x="-41" y="56" font-size="20" font-weight="700" fill="#1f2a33" text-anchor="middle">2</text>
    <text x="41" y="62" font-size="18" font-weight="700" fill="#1f2a33" text-anchor="middle">3</text>
  </g>
  <text x="772" y="400" class="t">Dati aperti e</text>
  <text x="772" y="428" class="t">gara mondiale</text>

  <!-- 4 · 2020 · doctor + machine -->
  <g transform="translate(1068,250)">
    <circle r="105" fill="#E07A3F" opacity="0.15"/>
    <circle cx="-48" cy="-38" r="16" fill="#ffffff" stroke="#1f2a33" stroke-width="3"/>
    <path d="M -78,40 C -78,0 -66,-14 -48,-14 C -30,-14 -18,0 -18,40 z" fill="#ffffff" stroke="#1f2a33" stroke-width="3"/>
    <path d="M -58,-12 C -62,6 -54,16 -48,16 C -42,16 -34,6 -38,-12" fill="none" stroke="#E07A3F" stroke-width="3"/>
    <circle cx="-48" cy="18" r="4" fill="#E07A3F"/>
    <text x="0" y="12" font-size="34" font-weight="700" fill="#1f2a33" text-anchor="middle">+</text>
    <rect x="18" y="-40" width="66" height="50" rx="6" fill="#ffffff" stroke="#1f2a33" stroke-width="3"/>
    <g fill="#E07A3F">
      <rect x="26" y="-6" width="6" height="8"/><rect x="34" y="-30" width="6" height="32"/><rect x="42" y="-14" width="6" height="16"/>
      <rect x="50" y="-2" width="6" height="4"/><rect x="58" y="-20" width="6" height="22"/><rect x="66" y="-4" width="6" height="6"/><rect x="74" y="-2" width="6" height="4"/>
    </g>
    <line x1="51" y1="10" x2="51" y2="26" stroke="#1f2a33" stroke-width="3"/>
    <line x1="36" y1="28" x2="66" y2="28" stroke="#1f2a33" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1068" y="400" class="t">Medico + macchina</text>
  <text x="1068" y="428" class="t">insieme</text>

  <!-- 5 · 2023–25 · foundation model (preview) -->
  <g transform="translate(1364,250)">
    <circle r="105" fill="#8a97a1" opacity="0.15"/>
    <circle r="105" fill="none" stroke="#8a97a1" stroke-width="2.5" stroke-dasharray="8 6"/>
    <g fill="#ffffff" stroke="#1f2a33" stroke-width="1.8">
      <rect x="-82" y="-50" width="14" height="14" rx="2"/><rect x="-64" y="-50" width="14" height="14" rx="2"/><rect x="-46" y="-50" width="14" height="14" rx="2"/>
      <rect x="-82" y="-32" width="14" height="14" rx="2"/><rect x="-64" y="-32" width="14" height="14" rx="2"/><rect x="-46" y="-32" width="14" height="14" rx="2"/>
      <rect x="-82" y="-14" width="14" height="14" rx="2"/><rect x="-64" y="-14" width="14" height="14" rx="2"/><rect x="-46" y="-14" width="14" height="14" rx="2"/>
      <rect x="-82" y="4" width="14" height="14" rx="2"/><rect x="-64" y="4" width="14" height="14" rx="2"/><rect x="-46" y="4" width="14" height="14" rx="2"/>
      <rect x="-82" y="22" width="14" height="14" rx="2"/><rect x="-64" y="22" width="14" height="14" rx="2"/><rect x="-46" y="22" width="14" height="14" rx="2"/>
    </g>
    <line x1="-26" y1="-7" x2="-2" y2="-7" class="ink" marker-end="url(#a)"/>
    <circle cx="42" cy="-7" r="40" fill="#ffffff" stroke="#1f2a33" stroke-width="3"/>
    <g class="edge">
      <line x1="24" y1="-26" x2="46" y2="-14"/><line x1="46" y1="-14" x2="62" y2="-28"/><line x1="46" y1="-14" x2="38" y2="10"/>
      <line x1="38" y1="10" x2="20" y2="4"/><line x1="38" y1="10" x2="60" y2="16"/><line x1="24" y1="-26" x2="20" y2="4"/><line x1="62" y1="-28" x2="60" y2="16"/>
    </g>
    <g fill="#8a97a1">
      <circle cx="24" cy="-26" r="5"/><circle cx="46" cy="-14" r="6"/><circle cx="62" cy="-28" r="5"/>
      <circle cx="38" cy="10" r="6"/><circle cx="20" cy="4" r="5"/><circle cx="60" cy="16" r="5"/>
    </g>
    <text x="-6" y="62" font-size="15" font-weight="700" fill="#5b6770" text-anchor="middle">milioni di immagini</text>
  </g>
  <text x="1364" y="400" class="t">Foundation model:</text>
  <text x="1364" y="428" class="t">prima impara la pelle</text>

  <!-- 6 · 2025–26 · agents orchestrating networks (preview) -->
  <g transform="translate(1660,250)">
    <circle r="105" fill="#6d5a8a" opacity="0.14"/>
    <circle r="105" fill="none" stroke="#6d5a8a" stroke-width="2.5" stroke-dasharray="8 6"/>
    <g stroke="#1f2a33" stroke-width="2.5">
      <line x1="0" y1="0" x2="-55" y2="-48"/><line x1="0" y1="0" x2="55" y2="-48"/>
      <line x1="0" y1="0" x2="-55" y2="48"/><line x1="0" y1="0" x2="55" y2="48"/>
    </g>
    <circle r="30" fill="#6d5a8a" stroke="#1f2a33" stroke-width="3"/>
    <text y="7" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">LLM</text>
    <g fill="#ffffff" stroke="#1f2a33" stroke-width="3">
      <circle cx="-55" cy="-48" r="22"/><circle cx="55" cy="-48" r="22"/>
      <circle cx="-55" cy="48" r="22"/><circle cx="55" cy="48" r="22"/>
    </g>
    <!-- quality: magnifier -->
    <circle cx="-58" cy="-51" r="8" fill="none" stroke="#1f2a33" stroke-width="2.5"/>
    <line x1="-52" y1="-45" x2="-45" y2="-38" stroke="#1f2a33" stroke-width="3" stroke-linecap="round"/>
    <!-- segmentation: dashed outline around a spot -->
    <circle cx="55" cy="-48" r="6" fill="#7a4a2c"/>
    <circle cx="55" cy="-48" r="12" fill="none" stroke="#6d5a8a" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- classification: bars -->
    <g fill="#6d5a8a">
      <rect x="-66" y="48" width="5" height="8"/><rect x="-59" y="38" width="5" height="18"/><rect x="-52" y="44" width="5" height="12"/><rect x="-45" y="52" width="5" height="4"/>
    </g>
    <!-- criteria: ABCD -->
    <text x="55" y="54" font-size="13" font-weight="700" fill="#1f2a33" text-anchor="middle">ABCD</text>
  </g>
  <text x="1660" y="400" class="t">Agenti che orchestrano</text>
  <text x="1660" y="428" class="t">più reti</text>

  <!-- Timeline -->
  <line x1="40" y1="500" x2="1364" y2="500" stroke="#1f2a33" stroke-width="3"/>
  <line x1="1364" y1="500" x2="1800" y2="500" stroke="#1f2a33" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M1800,492 L1816,500 L1800,508 z" fill="#1f2a33"/>
  <circle cx="180" cy="500" r="10" fill="#264653"/>
  <circle cx="476" cy="500" r="10" fill="#2A9D8F"/>
  <circle cx="772" cy="500" r="10" fill="#C9A227"/>
  <circle cx="1068" cy="500" r="10" fill="#E07A3F"/>
  <circle cx="1364" cy="500" r="10" fill="#fafbfc" stroke="#8a97a1" stroke-width="3"/>
  <circle cx="1660" cy="500" r="10" fill="#fafbfc" stroke="#6d5a8a" stroke-width="3"/>
  <text x="180" y="540" class="y">2017</text>
  <text x="476" y="540" class="y">2018 – 2019</text>
  <text x="772" y="540" class="y">2018 – 2019</text>
  <text x="1068" y="540" class="y">2020</text>
  <text x="1364" y="540" class="y">2023 – 2025</text>
  <text x="1660" y="540" class="y">2025 – 2026</text>
</svg>
