<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo Helper · Milestone 1</title>
<meta name="description" content="Neo Helper: key decisions, evidence and next steps at the end of milestone 1 (IT/EN/ES).">
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --ink: #1c2630; --muted: #5f6b76;
    --line: #dde2e7; --accent: #2A9D8F; --accent-ink: #ffffff; --shadow: 0 1px 2px rgba(20,30,40,.06), 0 6px 18px rgba(20,30,40,.06);
    --c-data: #3D5A80; --c-model: #2A9D8F; --c-trust: #C08A1E; --c-agents: #6d5a8a; --c-eval: #D9692F; --c-inclusion: #b5476b; --c-gov: #8a5a44;
    --bar-a: #2A9D8F; --bar-b: #D9692F; --bar-c: #8a97a1;
    --st-dec: #e9edf1; --st-dec-line: #5f6b76; --st-prop: #e3eefb; --st-prop-line: #6f9fd6; --st-open: #fff3d6; --st-open-line: #d9a632; --st-fut: #f6f7f9; --st-fut-line: #a3adb5;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1418; --surface: #172028; --surface-2: #1d2731; --ink: #e7ecf0; --muted: #9aa7b2; --line: #2b3742;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --c-data: #5f86b8; --c-agents: #8b74b3; --st-dec: #23303b; --st-dec-line: #8fa0ad; --st-prop: #1c2e44; --st-prop-line: #6f9fd6; --st-open: #3a3120; --st-open-line: #d9a632; --st-fut: #172028; --st-fut-line: #5b6873;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1418; --surface: #172028; --surface-2: #1d2731; --ink: #e7ecf0; --muted: #9aa7b2; --line: #2b3742;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --c-data: #5f86b8; --c-agents: #8b74b3; --st-dec: #23303b; --st-dec-line: #8fa0ad; --st-prop: #1c2e44; --st-prop-line: #6f9fd6; --st-open: #3a3120; --st-open-line: #d9a632; --st-fut: #172028; --st-fut-line: #5b6873;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: .2px; white-space: nowrap; }
  .brand-dot { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c9875a 0 28%, #7a4a2c 29% 60%, transparent 61%), var(--surface-2); border: 2px solid var(--ink); }
  .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: 0; }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1 1 auto; min-width: 0; scrollbar-width: none; }
  @media (max-width: 860px) {
    nav.tabs { order: 3; flex-basis: 100%; }
    .detail { position: static; }
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); white-space: nowrap; font-weight: 600; font-size: 14px; }
  nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  nav.tabs button:hover:not([aria-selected="true"]) { background: var(--surface-2); color: var(--ink); }
  .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
  .seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 12.5px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { max-width: 1240px; margin: 0 auto; padding: 22px 16px 60px; }
  .view { display: none; }
  .view.active { display: block; animation: rise .45s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  h1 { font-size: clamp(24px, 3.4vw, 38px); line-height: 1.15; margin: 6px 0 10px; letter-spacing: -.3px; }
  h2 { font-size: 21px; margin: 0 0 4px; letter-spacing: -.2px; }
  h3 { font-size: 16px; margin: 0 0 6px; }
  .lead { color: var(--muted); max-width: 820px; margin: 0 0 22px; }
  .eyebrow { font-size: 12px; font-weight: 750; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* Overview */
  .hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: stretch; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
  .hero-statement { font-size: 17px; }
  .hero-statement ul { margin: 10px 0 0; padding-left: 18px; }
  .hero-statement li { margin: 4px 0; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
  .kpi b { display: block; font-size: 30px; line-height: 1; letter-spacing: -.5px; }
  .kpi span { color: var(--muted); font-size: 13px; }
  .journey { display: grid; grid-template-columns: repeat(8, minmax(110px, 1fr)); gap: 0; overflow-x: auto; padding-bottom: 6px; }
  .jstep { position: relative; padding: 26px 10px 4px; text-align: left; }
  .jstep::before { content: ""; position: absolute; top: 10px; left: 0; right: 0; height: 3px; background: var(--line); }
  .jstep::after { content: ""; position: absolute; top: 4px; left: 10px; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--surface); transform: scale(0); transition: transform .4s ease; }
  .jstep.in::after { transform: scale(1); }
  .jstep .date { font-size: 12px; color: var(--muted); font-weight: 650; }
  .jstep .what { font-size: 13.5px; font-weight: 650; }
  .core-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* Choices */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .filters button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 650; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .choices-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
  @media (max-width: 920px) { .choices-layout { grid-template-columns: 1fr; } }
  .choice-list { display: grid; gap: 10px; }
  .choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px 12px 16px; cursor: pointer; position: relative; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
  .choice::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--area); }
  .choice:hover { transform: translateY(-1px); }
  .choice[aria-current="true"] { border-color: var(--area); box-shadow: 0 0 0 2px color-mix(in srgb, var(--area) 35%, transparent), var(--shadow); }
  .choice .id { font-size: 11.5px; font-weight: 750; color: var(--area); letter-spacing: .6px; }
  .choice .title { font-weight: 700; display: block; }
  .detail { position: sticky; top: 76px; }
  .detail .area-tag { color: var(--area); font-weight: 750; font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; }
  .detail dl { margin: 12px 0 0; }
  .detail dt { font-size: 12px; font-weight: 750; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
  .detail dd { margin: 4px 0 0; }
  .detail .src { color: var(--muted); font-style: italic; font-size: 13.5px; }

  /* Charts */
  .chart h3 { margin-bottom: 2px; }
  .chart .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 10px; align-items: center; margin: 7px 0; font-size: 13.5px; }
  .bar-track { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; border-radius: 999px; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .bar-val { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 52px; text-align: right; }
  .pair-row { margin: 10px 0; }
  .pair-row .lbl { font-size: 13.5px; font-weight: 650; margin-bottom: 4px; }
  .pair-row .bar-row { margin: 3px 0; grid-template-columns: minmax(70px, 30%) 1fr auto; font-size: 12.5px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .chart .source { color: var(--muted); font-size: 12px; font-style: italic; margin-top: 10px; }
  .chart .take { margin-top: 10px; font-weight: 650; font-size: 13.5px; }

  /* Pipeline */
  .pipe-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .play { border: 0; background: var(--accent); color: var(--accent-ink); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; }
  .pipe { display: grid; grid-template-columns: repeat(8, minmax(118px, 1fr)); gap: 10px; overflow-x: auto; padding: 4px 2px 10px; }
  .step { position: relative; display: flex; flex-direction: column; justify-content: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; cursor: pointer; min-height: 92px; text-align: left; box-shadow: var(--shadow); transition: transform .2s ease, background .3s ease, border-color .3s ease; }
  .step .n { font-size: 11px; font-weight: 800; color: var(--muted); }
  .step .s-title { font-weight: 700; font-size: 13.5px; display: block; margin-top: 2px; }
  .step .s-tool { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); display: block; margin-top: 4px; word-break: break-word; }
  .step:not(:last-child)::after { content: "→"; position: absolute; right: -11px; top: 38%; color: var(--muted); font-weight: 700; }
  .step.lit { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); transform: translateY(-3px); }
  .step[aria-current="true"] { border-color: var(--ink); }
  .pipe-detail { margin-top: 6px; min-height: 54px; }

  /* Questions */
  .rq { position: relative; border-top: 4px solid var(--rq); cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }
  .rq .verb { color: var(--rq); font-weight: 800; letter-spacing: .5px; text-transform: uppercase; font-size: 12.5px; }
  .rq .rq-id { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .rq .more { display: none; margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; font-size: 13.5px; }
  .rq[aria-expanded="true"] .more { display: block; animation: rise .3s ease both; }
  .rq .more b { display: block; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .core-badge { position: absolute; top: 18px; right: 18px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--rq); color: #fff; }

  /* Map */
  .map-top { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: center; margin-bottom: 14px; }
  @media (max-width: 720px) { .map-top { grid-template-columns: 1fr; } }
  .donut-wrap { position: relative; width: 200px; height: 200px; margin: 0 auto; }
  .donut-wrap svg { transform: rotate(-90deg); }
  .donut-wrap circle { fill: none; stroke-width: 22; transition: stroke-dasharray 1s ease, stroke-dashoffset 1s ease; }
  .donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .donut-center b { font-size: 34px; display: block; line-height: 1; }
  .layer { display: grid; grid-template-columns: 170px 1fr; gap: 10px; margin: 8px 0; align-items: stretch; }
  @media (max-width: 720px) { .layer { grid-template-columns: 1fr; } }
  .layer-name { border-radius: 10px; color: #fff; padding: 10px 12px; font-weight: 750; font-size: 13.5px; display: flex; flex-direction: column; justify-content: center; }
  .layer-name small { font-weight: 500; opacity: .9; font-size: 11.5px; }
  .blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .block { border-radius: 10px; padding: 9px 10px; font-size: 13px; font-weight: 650; border: 1.5px solid; transition: opacity .3s ease, transform .3s ease; }
  .block.dec { background: var(--st-dec); border-color: var(--st-dec-line); }
  .block.prop { background: var(--st-prop); border-color: var(--st-prop-line); }
  .block.open { background: var(--st-open); border-color: var(--st-open-line); border-style: dashed; }
  .block.fut { background: var(--st-fut); border-color: var(--st-fut-line); border-style: dashed; color: var(--muted); }
  .block.dim { opacity: .18; transform: scale(.97); }

  /* Roadmap */
  .gantt { position: relative; margin-top: 8px; }
  .g-row { display: grid; grid-template-columns: 210px 1fr; gap: 12px; align-items: center; margin: 6px 0; }
  @media (max-width: 720px) { .g-row { grid-template-columns: 1fr; } }
  .g-name { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-weight: 700; font-size: 13.5px; }
  .g-name small { display: block; color: var(--muted); font-weight: 500; }
  .g-track { position: relative; height: 26px; background: var(--surface-2); border-radius: 8px; }
  .g-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 6px; transform-origin: left; transform: scaleX(0); transition: transform .9s cubic-bezier(.2,.8,.2,1); }
  .g-bar.in { transform: scaleX(1); }
  .g-bar.done { background: var(--accent); }
  .g-bar.next { background: var(--c-eval); }
  .g-bar.planned { background: var(--bar-c); }
  .g-scale { display: grid; grid-template-columns: 210px 1fr; gap: 12px; font-size: 11.5px; color: var(--muted); }
  @media (max-width: 720px) { .g-scale { display: none; } }
  .g-ticks { display: flex; justify-content: space-between; }
  .g-issues { display: none; margin: 4px 0 10px; }
  .g-issues.open { display: block; animation: rise .3s ease both; }
  .g-issues ul { margin: 0; padding-left: 18px; columns: 2; column-gap: 24px; }
  @media (max-width: 720px) { .g-issues ul { columns: 1; } }
  .g-issues li { margin: 3px 0; break-inside: avoid; font-size: 13.5px; }

  .lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 18px; }
  .lists ol, .lists ul { margin: 6px 0 0; padding-left: 20px; }
  .lists li { margin: 5px 0; font-size: 14px; }

  footer { max-width: 1240px; margin: 0 auto; padding: 18px 16px 40px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } .bar-row { grid-template-columns: minmax(80px, 42%) 1fr auto; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span><div>Neo Helper<small id="brand-sub"></small></div></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="controls">
      <div class="seg" id="lang" role="group" aria-label="Language">
        <button data-lang="it">IT</button><button data-lang="en">EN</button><button data-lang="es">ES</button>
      </div>
      <button class="icon-btn" id="theme" aria-label="Theme">◐</button>
    </div>
  </div>
</header>
<main id="main"></main>
<footer id="footer"></footer>

<script>
"use strict";
/* ------------------------------------------------------------------ data */
const AREAS = {
  data:      { color: "var(--c-data)",      name: { it: "Dati", en: "Data", es: "Datos" } },
  model:     { color: "var(--c-model)",     name: { it: "Modello", en: "Model", es: "Modelo" } },
  trust:     { color: "var(--c-trust)",     name: { it: "Affidabilità", en: "Trust", es: "Confiabilidad" } },
  agents:    { color: "var(--c-agents)",    name: { it: "Agenti e MCP", en: "Agents & MCP", es: "Agentes y MCP" } },
  eval:      { color: "var(--c-eval)",      name: { it: "Valutazione", en: "Evaluation", es: "Evaluación" } },
  inclusion: { color: "var(--c-inclusion)", name: { it: "Inclusione (RQ6)", en: "Inclusion (RQ6)", es: "Inclusión (RQ6)" } },
  gov:       { color: "var(--c-gov)",       name: { it: "Regole e licenze", en: "Rules & licences", es: "Normas y licencias" } }
};

const UI = {
  brandSub: { it: "Uscita dalla Milestone 1 · 10 novembre 2026", en: "Milestone 1 exit · 10 November 2026", es: "Salida del Hito 1 · 10 de noviembre de 2026" },
  tabs: {
    overview:  { it: "Panoramica", en: "Overview", es: "Resumen" },
    choices:   { it: "Scelte", en: "Choices", es: "Decisiones" },
    evidence:  { it: "Evidenze", en: "Evidence", es: "Evidencia" },
    pipeline:  { it: "Pipeline", en: "Pipeline", es: "Pipeline" },
    questions: { it: "Domande", en: "Questions", es: "Preguntas" },
    map:       { it: "Mappa", en: "Map", es: "Mapa" },
    roadmap:   { it: "Prossimi passi", en: "Next steps", es: "Próximos pasos" }
  },
  heroEyebrow: { it: "Milestone 1 chiusa · letteratura", en: "Milestone 1 closed · literature", es: "Hito 1 cerrado · literatura" },
  heroTitle: { it: "Un assistente per il medico che vede, dubita, spiega e include", en: "An assistant for doctors that sees, doubts, explains and includes", es: "Un asistente para el médico que ve, duda, explica e incluye" },
  heroItems: [
    { it: "Vede la lesione con un foundation model dermatologico congelato (PanDerm).", en: "Sees the lesion with a frozen dermatology foundation model (PanDerm).", es: "Ve la lesión con un modelo fundacional dermatológico congelado (PanDerm)." },
    { it: "Dice «non so» con una garanzia statistica (conformal).", en: "Says «I don't know» with a statistical guarantee (conformal).", es: "Dice «no lo sé» con una garantía estadística (conformal)." },
    { it: "Spiega con i criteri del dermatologo e con casi simili.", en: "Explains with the dermatologist's criteria and similar cases.", es: "Explica con los criterios del dermatólogo y casos similares." },
    { it: "Coordina i suoi strumenti con un agente via MCP, senza inventare numeri.", en: "Coordinates its tools with an MCP agent, never inventing numbers.", es: "Coordina sus herramientas con un agente vía MCP, sin inventar números." },
    { it: "È valutato fuori dal laboratorio, anche su pelli latinoamericane e acrali.", en: "Is evaluated outside the lab, including Latin American and acral skin.", es: "Se evalúa fuera del laboratorio, también en pieles latinoamericanas y acrales." }
  ],
  kpis: [
    { n: 42, l: { it: "schede di paper", en: "paper notes", es: "fichas de artículos" } },
    { n: 6,  l: { it: "domande di ricerca", en: "research questions", es: "preguntas de investigación" } },
    { n: 47, l: { it: "blocchi in 8 livelli", en: "blocks in 8 layers", es: "bloques en 8 capas" } },
    { n: 12, l: { it: "issue M1 chiuse", en: "M1 issues closed", es: "issues M1 cerradas" } },
    { n: 9,  l: { it: "file Word", en: "Word files", es: "archivos Word" } },
    { n: 21, l: { it: "episodi audio", en: "audio episodes", es: "episodios de audio" } }
  ],

function readStore(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function writeStore(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* storage may be blocked */ } }
function tr(v) { if (v == null) return ""; if (typeof v === "string") return v; return v[lang] ?? v.en ?? ""; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(v, dec) {
  const s = dec != null ? v.toFixed(dec) : (Number.isInteger(v) ? String(v) : v.toFixed(1));
  return lang === "en" ? s : s.replace(".", ",");
}

/* ------------------------------------------------------------------ charts */
const BAR_COLORS = { a: "var(--bar-a)", b: "var(--bar-b)", c: "var(--bar-c)" };
function chartHTML(key, compact) {
  const c = CHARTS[key];
  if (!c) return "";
  let body = "";
  if (c.type === "bars") {
    body = c.rows.map(r => `<div class="bar-row"><span>${esc(tr(r.l))}</span><div class="bar-track"><div class="bar-fill" data-w="${(r.v / c.max) * 100}" style="background:${BAR_COLORS[r.c || "a"]}"></div></div><span class="bar-val">${fmt(r.v, c.dec)}${esc(c.unit)}</span></div>`).join("");
  } else {
    body = c.rows.map(r => `<div class="pair-row"><div class="lbl">${esc(tr(r.l))}</div>
      <div class="bar-row"><span>${esc(tr(c.keys[0]))}</span><div class="bar-track"><div class="bar-fill" data-w="${(r.a / c.max) * 100}" style="background:var(--bar-c)"></div></div><span class="bar-val">${fmt(r.a, c.dec)}${esc(c.unit)}</span></div>
      <div class="bar-row"><span>${esc(tr(c.keys[1]))}</span><div class="bar-track"><div class="bar-fill" data-w="${(r.b / c.max) * 100}" style="background:var(--bar-a)"></div></div><span class="bar-val">${fmt(r.b, c.dec)}${esc(c.unit)}</span></div></div>`).join("");
  }
  return `<div class="chart ${compact ? "" : "card"}"><h3>${esc(tr(c.title))}</h3><div class="sub">${esc(tr(c.sub))}</div>${body}<div class="take">${esc(tr(c.take))}</div><div class="source">${esc(c.src)}</div></div>`;
}

const io = ("IntersectionObserver" in window) ? new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { animateIn(e.target); io.unobserve(e.target); } });
}, { threshold: 0.2 }) : null;
function animateIn(el) {
  el.querySelectorAll(".bar-fill").forEach(b => { b.style.width = b.dataset.w + "%"; });
  el.querySelectorAll(".g-bar").forEach(b => b.classList.add("in"));
  el.querySelectorAll(".jstep").forEach((s, i) => setTimeout(() => s.classList.add("in"), 90 * i));
  el.querySelectorAll("[data-count]").forEach(countUp);
}
function watch(root) {
  root.querySelectorAll(".chart, .gantt, .journey, .kpis").forEach(el => { if (io) io.observe(el); else animateIn(el); });
}
function countUp(el) {
  const target = Number(el.dataset.count);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = target; return; }
  const t0 = performance.now(), dur = 900;
  function step(t) { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

function stepsHTML(steps, group) {

function renderPipeline() {

    <div class="card"><div class="pipe-head"><h2>${esc(tr(UI.build))}</h2><button class="play" data-play="build">${esc(tr(UI.play))}</button></div>

    <p class="lead" style="margin-top:14px">${esc(tr(UI.versions))}</p>`;

function showStep(group, i) {
  const steps = group === "build" ? STEP_BUILD : STEP_USE;
  document.querySelectorAll(`.step[data-group="${group}"]`).forEach((el, k) => { el.classList.toggle("lit", k === i); el.setAttribute("aria-current", k === i); });
  const s = steps[i];
  const box = document.getElementById("detail-" + group);
  if (box) box.innerHTML = `<b>${i + 1}. ${esc(tr(s.t))}</b> — ${esc(tr(s.d))}`;
}
function playPipeline(group) {
  clearInterval(pipeTimer);
  const n = (group === "build" ? STEP_BUILD : STEP_USE).length;
  let i = 0; showStep(group, 0);
  pipeTimer = setInterval(() => { i += 1; if (i >= n) { clearInterval(pipeTimer); return; } showStep(group, i); }, 950);
}

function renderMap() {
  const counts = { dec: 0, prop: 0, open: 0, fut: 0 };
  LAYERS.forEach(l => l.blocks.forEach(b => { counts[b[1]] += 1; }));
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const colors = { dec: "var(--st-dec-line)", prop: "var(--st-prop-line)", open: "var(--st-open-line)", fut: "var(--st-fut-line)" };
  const R = 80, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = Object.keys(counts).map(k => { const len = C * counts[k] / total; const s = `<circle r="${R}" cx="100" cy="100" stroke="${colors[k]}" stroke-dasharray="0 ${C}" data-len="${len}" data-off="${-off}" style="stroke-dashoffset:${-off}"></circle>`; off += len; return s; }).join("");
  const filterBtns = Object.keys(counts).map(k => `<button data-status="${k}" aria-pressed="${statusFilter === k}"><span class="dot" style="background:${colors[k]}"></span>${esc(tr(UI.status[k]))} · ${counts[k]}</button>`).join("");
  const layers = LAYERS.map(l => `<div class="layer"><div class="layer-name" style="background:${l.color}">${esc(tr(l.name))}<small>${esc(l.ms)}</small></div>
      <div class="blocks">${l.blocks.map(b => `<div class="block ${b[1]}${statusFilter && statusFilter !== b[1] ? " dim" : ""}" title="${esc(tr(UI.status[b[1]]))}">${esc(tr(b[0]))}</div>`).join("")}</div></div>`).join("");
  return `<h1>${esc(tr(UI.tabs.map))}</h1><p class="lead">${esc(tr(UI.mapLead))}</p>
    <div class="card"><div class="map-top"><div class="donut-wrap"><svg width="200" height="200" viewBox="0 0 200 200" id="donut">${arcs}</svg><div class="donut-center"><div><b>${total}</b><span>${esc(tr(UI.blocks))}</span></div></div></div>
      <div class="filters" id="status-filters" style="margin:0">${filterBtns}</div></div>${layers}</div>`;
}
function animateDonut() {
  document.querySelectorAll("#donut circle").forEach(c => { requestAnimationFrame(() => { c.style.strokeDasharray = `${c.dataset.len} 1000`; }); });
}

function renderRoadmap() {
  const W = 26;
  const ticks = [1, 5, 9, 13, 17, 21, 26].map(w => `<span>${w}</span>`).join("");
  const rows = MILESTONES.map(m => {
    const left = ((m.w[0] - 1) / W) * 100, width = ((m.w[1] - m.w[0] + 1) / W) * 100;
    const issues = m.issues.map(([n, t]) => `<li><a href="${GH}${n}" target="_blank" rel="noopener">#${n}</a> ${esc(tr(t))}</li>`).join("");
    return `<div class="g-row"><button class="g-name" data-ms="${m.id}" aria-expanded="${openMilestone === m.id}">${m.id} · ${esc(tr(m.name))}<small>${esc(tr(UI.weeks))} ${m.w[0]}–${m.w[1]}</small></button>
      <div class="g-track"><div class="g-bar ${m.st}" style="left:${left}%;width:${width}%"></div></div></div>
      <div class="g-issues ${openMilestone === m.id ? "open" : ""}" id="iss-${m.id}"><ul>${issues}</ul></div>`;
  }).join("");
  const oq = OPEN_Q.map(q => `<li>${esc(tr(q))}</li>`).join("");
  const pend = PENDING.map(q => `<li>${esc(tr(q))}</li>`).join("");
  return `<h1>${esc(tr(UI.tabs.roadmap))}</h1><p class="lead">${esc(tr(UI.roadmapLead))}</p>
    <div class="card"><div class="g-scale"><span></span><div class="g-ticks">${ticks}</div></div><div class="gantt">${rows}</div></div>
    <div class="lists"><div class="card"><h2>${esc(tr(UI.openQ))}</h2><ol>${oq}</ol></div><div class="card"><h2>${esc(tr(UI.pending))}</h2><ul>${pend}</ul></div></div>`;
}

  if (view === "map") animateDonut();
}
function go(v) { if (!VIEWS.includes(v)) return; view = v; history.replaceState(null, "", "#" + v); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.lang) { lang = t.dataset.lang; writeStore("neoHelperLang", lang); return render(); }
  if (t.id === "theme") {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; writeStore("neoHelperTheme", root.dataset.theme); return;
  }
  if (t.dataset.area) { areaFilter = t.dataset.area; return render(); }
  if (t.dataset.choice) { selectedChoice = Number(t.dataset.choice); render(); const d = document.querySelector(".detail"); if (d && window.innerWidth < 920) d.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (t.dataset.play) return playPipeline(t.dataset.play);
  if (t.dataset.group) { clearInterval(pipeTimer); return showStep(t.dataset.group, Number(t.dataset.step)); }
  if (t.dataset.rq) { const open = t.getAttribute("aria-expanded") === "true"; t.setAttribute("aria-expanded", !open); return; }
  if (t.dataset.status) { statusFilter = statusFilter === t.dataset.status ? null : t.dataset.status; return render(); }
  if (t.dataset.ms) { openMilestone = openMilestone === t.dataset.ms ? null : t.dataset.ms; document.querySelectorAll(".g-issues").forEach(el => el.classList.toggle("open", el.id === "iss-" + openMilestone)); document.querySelectorAll(".g-name").forEach(el => el.setAttribute("aria-expanded", el.dataset.ms === openMilestone)); }
});

(function init() {
  const params = new URLSearchParams(location.search);
  const stored = readStore("neoHelperLang");
  const nav = (navigator.language || "it").slice(0, 2);
  lang = ["it", "en", "es"].find(l => l === params.get("lang")) || ["it", "en", "es"].find(l => l === stored) || (["it", "en", "es"].includes(nav) ? nav : "it");
  const theme = readStore("neoHelperTheme");
  if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
  const hash = location.hash.replace("#", "");
  if (VIEWS.includes(hash)) view = hash;
  render();
})();
</script>
</body>
