  .muted { color: var(--muted); }

  .packages { display: grid; grid-template-columns: repeat(6, minmax(140px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }

  .pkg .name { font-weight: 700; font-size: 14px; display: block; }

  .timeline { list-style: none; margin: 0; padding: 0; }

  .timeline .what b { display: block; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

const VIEWS = ["overview", "flow", "code", "tests", "data", "findings", "follow"];
const ENV = 'UV_PROJECT_ENVIRONMENT="$HOME/.venvs/neo-helper-ml" uv run --project ml';

/* ------------------------------------------------------------ helpers */
let lang = "it", view = "overview", selectedModule = "neo.data.cli", testFilter = "all";

function readStore(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function writeStore(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* storage may be blocked */ } }
function tr(v) { if (v == null) return ""; if (typeof v === "string") return v; return v[lang] ?? v.en ?? ""; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function locale() { return lang === "en" ? "en-GB" : lang === "es" ? "es-ES" : "it-IT"; }
function num(n, dec = 0) { return Number(n).toLocaleString(locale(), { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: true }); }
function pct(x, dec = 1) { return num(x * 100, dec) + "%"; }
function size(bytes) {
  const units = ["B", "kB", "MB", "GB"]; let v = bytes, i = 0;
  while (v >= 1000 && i < units.length - 1) { v /= 1000; i++; }
  return num(v, i === 0 ? 0 : (v < 10 ? 2 : 1)) + " " + units[i];
}
function fill(text, values) { return text.replace(/\{(\w+)\}/g, (_, k) => values[k] ?? ""); }
const short = name => name.replace(/^neo\./, "");
function has(path, ...keys) { return keys.reduce((o, k) => (o && o[k] != null ? o[k] : null), path); }

const F = FACTS || {};
const MODS = (has(F, "code", "modules") || []).filter(m => m.functions.length || m.imports.length);
const MOD = Object.fromEntries(MODS.map(m => [m.name, m]));
const TFILES = has(F, "tests", "files") || {};
function usedBy(name) { return MODS.filter(m => m.imports.includes(name)).map(m => m.name); }
function testedBy(name) { return Object.keys(TFILES).filter(f => TFILES[f].imports.includes(name)); }
function group(name) { return (MODULES[name] && MODULES[name].g) || "base"; }
function modChip(name) {
  const g = GROUPS[group(name)];
  return `<button class="chip" data-mod="${esc(name)}"><span class="sw" style="background:${g.color}"></span>${esc(short(name))}</button>`;
}
function testChip(file) {
  const t = TFILES[file]; const tests = t ? t.tests : [];
  const bad = tests.some(x => x.status === "failed");
  return `<button class="chip" data-tfile="${esc(file)}"><span class="${bad ? "s-failed" : "s-passed"}">${bad ? "✗" : "✓"}</span>${esc(file)}</button>`;
}
function place(path) { return (has(F, "data", "places") || []).find(p => p.path === path); }
function cmdBlock(cmd) { return `<div class="cmd-block"><code>${esc(cmd)}</code><button class="copy" data-copy="${esc(cmd)}">${esc(tr(UI.copy))}</button></div>`; }

/* ------------------------------------------------------------ views */
function renderOverview() {
  const h = has(F, "data", "ham10000") || {};
  const t = has(F, "tests", "totals") || { passed: 0, failed: 0, skipped: 0 };
  const total = t.passed + t.failed + t.skipped;
  const lines = MODS.reduce((s, m) => s + m.lines, 0);
  const commits = has(F, "git", "commits") || [];
  const unpushed = has(F, "git", "unpushed") || [];
  const kpis = [
    [num(h.images || 0), UI.kImages], [num(h.lesions || 0), UI.kLesions],
    [`${num(t.passed)}/${num(total)}`, UI.kTests], [num(MODS.length), UI.kModules],
    [num(lines), UI.kLines], [size(has(F, "data", "total_bytes") || 0), UI.kData], [num(commits.length), UI.kCommits]
  ].map(([v, l]) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(tr(l))}</span></div>`).join("");
  const pkgs = PACKAGES.map(p => `<div class="pkg" style="--st:var(--st-${p.st})"><span class="id">${p.id} · <a href="${esc(has(F, "git", "remote") || "")}/issues/${p.issue}" target="_blank" rel="noopener">#${p.issue}</a></span><span class="name">${esc(tr(p.name))}</span><span class="st">${esc(tr(ST_NAME[p.st]))}</span><div class="small muted">${esc(tr(p.note))}</div></div>`).join("");
  const story = STORY.map(s => `<li><span class="when">${esc(s.d)}</span><span class="what"><b>${esc(tr(s.t))}</b><span class="muted small">${esc(tr(s.x))}</span></span></li>`).join("");
  const warn = unpushed.length ? `<p class="note">${num(unpushed.length)} ${esc(tr(UI.unpushed))}: <code>${esc(unpushed.join(", "))}</code></p>` : "";
  return `<div class="eyebrow">${esc(tr(UI.heroEyebrow))}</div><h1>${esc(tr(UI.heroTitle))}</h1><p class="lead">${esc(tr(UI.heroLead))}</p>
    <div class="kpis">${kpis}</div>
    <div class="card"><h2>${esc(tr(UI.packages))}</h2><div class="packages">${pkgs}</div></div>
    <div class="card" style="margin-top:14px"><h2>${esc(tr(UI.story))}</h2><ul class="timeline">${story}</ul>${warn}</div>`;
}

function renderFlow() {
  const stages = STAGES.map((s, i) => {
    const inputs = s.input.map(x => `<li>${esc(tr(x))}</li>`).join("");
    const outs = s.out.map(o => { const p = place(o); return `<li><code>${esc(o)}</code>${p ? ` <span class="muted">${esc(size(p.bytes))}</span>` : ""}</li>`; }).join("");
    const tryIt = s.try ? cmdBlock(`${ENV} ${s.try}`) : "";
    return `<section class="stage"><div class="stage-head"><span class="stage-n">${i + 1}</span><div><h3>${esc(tr(s.title))}</h3><div class="muted small">${esc(tr(s.lead))}</div></div></div>
      <div class="stage-row">
        <div class="box"><span class="lbl">${esc(tr(UI.fIn))}</span><ul>${inputs}</ul></div><div class="arrow" aria-hidden="true">→</div>
        <div class="box"><span class="lbl">${esc(tr(UI.fDo))}</span><span class="cmd">${esc(s.cmd)}</span><div class="chips">${s.mods.map(modChip).join("")}</div></div><div class="arrow" aria-hidden="true">→</div>
        <div class="box"><span class="lbl">${esc(tr(UI.fOut))}</span><ul>${outs}</ul></div>
        <div class="box"><span class="lbl">${esc(tr(UI.fTest))}</span><div class="chips">${s.tfiles.map(testChip).join("")}</div></div>
      </div>
      <details><summary>${esc(tr(UI.fMore))}</summary><p>${esc(tr(s.more))}</p>${tryIt}</details></section>`;
  }).join("");
  return `<h1>${esc(tr(UI.tabs.flow))}</h1><p class="lead">${esc(tr(UI.flowLead))}</p>${stages}
    <p class="note info">${esc(tr(UI.base))} <span class="chips" style="display:inline-flex;margin-left:6px">${["neo.paths", "neo.device", "neo.check"].filter(n => MOD[n]).map(modChip).join("")}</span></p>`;
}

/* Layered layout: a module sits one layer above the deepest module it uses. */
function layers() {
  const depth = {};
  const visit = (n, seen = new Set()) => {
    if (depth[n] != null) return depth[n];
    if (seen.has(n)) return 0;
    seen.add(n);
    const deps = (MOD[n] ? MOD[n].imports : []).filter(d => MOD[d]);
    depth[n] = deps.length ? 1 + Math.max(...deps.map(d => visit(d, seen))) : 0;
    return depth[n];
  };
  MODS.forEach(m => visit(m.name));
  const max = Math.max(0, ...Object.values(depth));
  const rows = [];
  for (let d = max; d >= 0; d--) {
    rows.push(MODS.filter(m => depth[m.name] === d).map(m => m.name)
      .sort((a, b) => Object.keys(GROUPS).indexOf(group(a)) - Object.keys(GROUPS).indexOf(group(b)) || a.localeCompare(b)));
  }
  return rows;
}

function renderMap() {
  const rows = layers();
  const W = 980, nodeW = 152, nodeH = 36, rowGap = 78, top = 18;
  const pos = {};
  rows.forEach((row, r) => {
    const gap = Math.min(18, (W - row.length * nodeW) / Math.max(1, row.length + 1));
    const total = row.length * nodeW + (row.length - 1) * gap;
    row.forEach((n, i) => { pos[n] = { x: (W - total) / 2 + i * (nodeW + gap), y: top + r * rowGap }; });
  });
  const H = top + rows.length * rowGap - 20;
  const sel = selectedModule;
  const related = new Set([sel, ...(MOD[sel] ? MOD[sel].imports : []), ...usedBy(sel)]);
  const edges = MODS.flatMap(m => m.imports.filter(d => pos[d]).map(d => {
    const a = pos[m.name], b = pos[d];
    const x1 = a.x + nodeW / 2, y1 = a.y + nodeH, x2 = b.x + nodeW / 2, y2 = b.y;
    const hot = m.name === sel || d === sel;
    const my = (y1 + y2) / 2;
    return `<path class="edge ${hot ? "hot" : (sel ? "dim" : "")}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2 - 6}" marker-end="url(#${hot ? "ah" : "a"})"/>`;
  })).join("");
  const nodes = Object.entries(pos).map(([n, p]) => {
    const g = GROUPS[group(n)];
    const cls = n === sel ? "sel" : (related.has(n) ? "" : "dim");
    return `<g class="node ${cls}" data-mod="${esc(n)}" tabindex="0" role="button" aria-label="${esc(short(n))}">
      <rect class="body" x="${p.x}" y="${p.y}" width="${nodeW}" height="${nodeH}" rx="8"/>
      <rect class="strip" x="${p.x}" y="${p.y}" width="6" height="${nodeH}" rx="3" style="fill:${g.color}"/>
      <text x="${p.x + 14}" y="${p.y + 23}">${esc(short(n))}</text></g>`;
  }).join("");
  const legend = Object.values(GROUPS).map(g => `<span><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${g.color};margin-right:5px"></span>${esc(tr(g.name))}</span>`).join("");
  return `<div class="card map"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr(UI.tabs.code))}">
      <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker></defs>
      ${edges}${nodes}</svg><div class="legend">${legend}</div></div>`;
}

function renderCode() {
  if (!MOD[selectedModule]) selectedModule = MODS[0] ? MODS[0].name : "";
  const m = MOD[selectedModule];
  if (!m) return `<p class="note">${esc(tr(UI.noFacts))}</p>`;
  const info = MODULES[m.name];
  const fns = m.functions.map(f => `<div class="fn ${f.private ? "private" : ""}"><div class="sig">${esc(f.kind === "class" ? "class " + f.signature : f.signature)}</div>${f.doc ? `<div class="doc">${esc(f.doc)}</div>` : ""}</div>`).join("");
  const list = (arr, fn) => arr.length ? `<div class="chips">${arr.map(fn).join("")}</div>` : `<span class="muted">${esc(tr(UI.none))}</span>`;
  const cmds = m.commands.length ? `<dt>${esc(tr(UI.dCmds))}</dt><dd>${m.commands.map(c => `<div><code>${esc(c.name)}</code> <span class="muted small">${esc(c.help)}</span></div>`).join("")}</dd>` : "";
  const all = MODS.map(x => modChip(x.name)).join("");
  return `<h1>${esc(tr(UI.tabs.code))}</h1><p class="lead">${esc(tr(UI.codeLead))}</p>
    ${renderMap()}<div class="mod-list">${all}</div>
    <aside class="card detail" style="margin-top:14px"><div class="eyebrow" style="color:${GROUPS[group(m.name)].color}">${esc(tr(GROUPS[group(m.name)].name))}</div>
      <h2 class="mono">${esc(m.name)}</h2>
      <div class="detail-grid"><dl><dt>${esc(tr(UI.dWhat))}</dt><dd>${info ? esc(tr(info.what)) : `<span class="note">${esc(tr(UI.missingText))}</span>`}</dd>
      <dt>${esc(tr(UI.dFile))}</dt><dd><code>${esc(m.file)}</code> · ${num(m.lines)} ${esc(tr(UI.lines))}</dd>
      ${m.doc ? `<dt>${esc(tr(UI.dDoc))}</dt><dd class="muted small">${esc(m.doc)}</dd>` : ""}
      ${cmds}
      <dt>${esc(tr(UI.dUses))}</dt><dd>${list(m.imports, modChip)}</dd>
      <dt>${esc(tr(UI.dUsedBy))}</dt><dd>${list(usedBy(m.name), modChip)}</dd>
      <dt>${esc(tr(UI.dTests))}</dt><dd>${list(testedBy(m.name), testChip)}</dd></dl>
      <dl><dt>${esc(tr(UI.dFns))}</dt><dd>${fns}<div class="muted small" style="margin-top:6px">${esc(tr(UI.privateNote))}</div></dd></dl></div>
    </aside>`;
}

function renderTests() {
  const t = has(F, "tests") || { totals: { passed: 0, failed: 0, skipped: 0 }, files: {} };
  const files = Object.keys(TFILES);
  const shown = testFilter === "all" ? files : files.filter(f => f === testFilter);
  const icon = { passed: "✓", failed: "✗", skipped: "–" };
  const summary = ["passed", "failed", "skipped"].map(s => `<span class="badge s-${s}">${icon[s]} ${num(t.totals[s])} ${esc(tr(UI[s]))}</span>`).join("");
  const filters = [`<button data-tfilter="all" aria-pressed="${testFilter === "all"}">${esc(tr(UI.all))}</button>`]
    .concat(files.map(f => `<button data-tfilter="${esc(f)}" aria-pressed="${testFilter === f}">${esc(f)} (${TFILES[f].tests.length})</button>`)).join("");
  const cards = shown.map(f => {
    const tf = TFILES[f];
    const rows = tf.tests.map(x => {
      const base = x.name.replace(/\[.*\]$/, ""), param = (x.name.match(/\[(.*)\]$/) || [])[1];
      const what = TESTS[base] ? tr(TESTS[base]) + (param ? ` (${param})` : "") : x.name;
      const msg = x.message ? `<span class="tname s-${x.status}">${esc(x.message)}</span>` : "";
      return `<div class="test-row"><span class="icon s-${x.status}" title="${esc(tr(UI[x.status]))}">${icon[x.status]}</span><span>${esc(what)}<span class="tname">${esc(x.name)}</span>${msg}</span><span class="t">${num(x.seconds, 2)} s</span></div>`;
    }).join("");
    return `<div class="card" id="tf-${esc(f)}"><h3 class="mono">${esc(f)}</h3><p class="muted small" style="margin:0 0 8px">${esc(tr(TESTS[f] || ""))}</p>
      <div class="small" style="margin-bottom:8px"><b>${esc(tr(UI.checks))}:</b> <span class="chips" style="display:inline-flex">${tf.imports.map(modChip).join("")}</span></div>${rows}</div>`;
  }).join("");
  return `<h1>${esc(tr(UI.tabs.tests))}</h1><p class="lead">${esc(tr(UI.testsLead))}</p>
    <div class="test-summary">${summary}<span class="muted small">${esc(tr(UI.ran))} ${esc(F.generated || "")} · ${num(t.seconds || 0, 1)} ${esc(tr(UI.inSec))}</span></div>
    <div class="filters">${filters}</div><div class="grid g2">${cards}</div>`;
}

function bars(entries, total) {
  const max = Math.max(...entries.map(e => e[1]));
  return entries.map(([k, v]) => `<div class="bar-row"><span>${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${(v / max) * 100}%"></div></div><span class="bar-val">${num(v)} · ${pct(v / total, 1)}</span></div>`).join("");
}

function renderData() {
  const d = F.data || {};
  const places = (d.places || []).map(p => `<tr><td><code>${esc(p.path)}</code></td><td class="num">${esc(size(p.bytes))}</td><td class="num">${num(p.files)}</td></tr>`).join("");
  const sets = DATASETS.map(s => { const p = place(s.key); return `<tr><td><b>${esc(tr(s.name))}</b></td><td>${esc(tr(s.how))}</td><td>${esc(tr(s.lic))}</td><td>${esc(s.src)}</td><td>${esc(tr(s.use))}</td><td class="num">${p ? esc(size(p.bytes)) : "–"}</td></tr>`; }).join("");
  const h = d.ham10000 || {}; const sp = d.split || {};
  const classes = h.classes ? bars(Object.entries(h.classes), h.images) : "";
  const parts = ["train", "val", "test"];
  const splitRows = sp.images ? `<tr><td>${esc(tr(UI.images))}</td>${parts.map(p => `<td class="num">${num(sp.images[p])}</td>`).join("")}</tr>
      <tr><td>${esc(tr(UI.lesions))}</td>${parts.map(p => `<td class="num">${num(sp.lesions[p])}</td>`).join("")}</tr>
      <tr><td>${esc(tr(UI.malShare))}</td>${parts.map(p => `<td class="num">${pct(sp.malignant_share[p])}</td>`).join("")}</tr>
      ${Object.entries(sp.by_class || {}).map(([c, v]) => `<tr><td class="mono">${esc(c)}</td>${parts.map(p => `<td class="num">${num(v[p])}</td>`).join("")}</tr>`).join("")}` : "";
  return `<h1>${esc(tr(UI.tabs.data))}</h1><p class="lead">${esc(tr(UI.dataLead))}</p>
    <div class="grid g2"><div class="card"><h2>${esc(tr(UI.onDisk))} · ${esc(size(d.total_bytes || 0))}</h2><div class="table-wrap"><table><thead><tr><th>${esc(tr(UI.cPath))}</th><th class="num">${esc(tr(UI.cSize))}</th><th class="num">${esc(tr(UI.cFiles))}</th></tr></thead><tbody>${places}</tbody></table></div></div>
    <div class="card"><h2>${esc(tr(UI.classes))}</h2>${classes}<p class="muted small">${esc(tr(UI.figuresLink))}</p></div></div>
    <div class="card" style="margin-top:14px"><h2>${esc(tr(UI.datasets))}</h2><div class="table-wrap"><table><thead><tr><th>${esc(tr(UI.cName))}</th><th>${esc(tr(UI.cHow))}</th><th>${esc(tr(UI.cLic))}</th><th>${esc(tr(UI.cSrc))}</th><th>${esc(tr(UI.cUse))}</th><th class="num">${esc(tr(UI.cSize))}</th></tr></thead><tbody>${sets}</tbody></table></div></div>
    <div class="card" style="margin-top:14px"><h2>${esc(tr(UI.splitT))}</h2><p class="muted small"><code>${esc(sp.file || "")}</code></p><div class="table-wrap"><table><thead><tr><th></th>${parts.map(p => `<th class="num">${esc(tr(UI[p]))}</th>`).join("")}</tr></thead><tbody>${splitRows}</tbody></table></div></div>`;
}

function renderFindings() {
  const d = F.data || {}; const h = d.ham10000 || {}; const a = d.artifacts || {}; const dup = d.duplicates || {};
  const nvShare = h.classes ? h.classes.nv / h.images : 0;
  const multi = h.images_per_lesion ? Object.entries(h.images_per_lesion).filter(([k]) => k !== "1").reduce((s, [k, v]) => s + Number(k) * v, 0) / h.images : 0;
  const darkM = a.dark_by_malignant ? a.dark_by_malignant["True"] : 0, darkB = a.dark_by_malignant ? a.dark_by_malignant["False"] : 0;
  const cards = [
    [UI.f1t, pct(nvShare, 0), tr(UI.f1x), "var(--g-data)"],
    [UI.f2t, pct(multi, 0), tr(UI.f2x), "var(--g-data)"],
    [UI.f3t, "90%", tr(UI.f3x), "var(--warn)"],
    [UI.f4t, num(dup.across_lesions ?? 0), fill(tr(UI.f4x), { p: num(dup.pairs ?? 0) }), "var(--ok)"],
    [UI.f5t, pct(darkM), fill(tr(UI.f5x), { b: pct(darkB), v: pct(a.dark_by_centre ? a.dark_by_centre.vidir_modern : 0) }), "var(--bad)"]
  ].map(([t, big, x, c]) => `<div class="card finding" style="--fc:${c}"><h3>${esc(tr(t))}</h3><span class="big">${esc(big)}</span><div class="small">${esc(x)}</div></div>`).join("");
  const monet = MONET_CHECK.map(r => `<tr><td><b>${esc(tr(r.c))}</b></td><td class="verdict ${r.v}">${r.v === "yes" ? "✓ " + esc(tr(UI.vYes)) : "✗ " + esc(tr(UI.vNo))}</td><td class="muted">${esc(tr(r.s))}</td></tr>`).join("");
  const dec = DECISIONS.map(([dt, x]) => `<li><span class="date">${esc(dt)}</span>${esc(tr(x))}</li>`).join("");
  const open = OPEN.map(x => `<li>${esc(tr(x))}</li>`).join("");
  return `<h1>${esc(tr(UI.tabs.findings))}</h1><p class="lead">${esc(tr(UI.findingsLead))}</p>
    <div class="grid g3">${cards}</div>
    <div class="card finding" style="--fc:var(--warn);margin-top:14px"><h3>${esc(tr(UI.f6t))}</h3><p class="small" style="margin:4px 0 8px">${esc(tr(UI.f6x))}</p><div class="table-wrap"><table><tbody>${monet}</tbody></table></div></div>
    <div class="grid g2" style="margin-top:14px"><div class="card"><h2>${esc(tr(UI.decisions))}</h2><ul class="decisions">${dec}</ul></div><div class="card"><h2>${esc(tr(UI.open))}</h2><ul class="decisions">${open}</ul></div></div>`;
}

function renderFollow() {
  const g = F.git || { commits: [], unpushed: [], remote: "" };
  const commits = g.commits.map(c => {
    const pending = g.unpushed.includes(c.hash);
    const link = pending ? `<code>${esc(c.hash)}</code>` : `<a class="mono" href="${esc(g.remote)}/commit/${esc(c.hash)}" target="_blank" rel="noopener">${esc(c.hash)}</a>`;
    return `<div class="commit"><span>${link}</span><span class="d muted">${esc(c.date)}</span><span>${esc(c.subject)}${pending ? ` <span class="badge s-skipped">${esc(tr(UI.notPushed))}</span>` : ""}</span></div>`;
  }).join("");
  return `<h1>${esc(tr(UI.tabs.follow))}</h1><p class="lead">${esc(tr(UI.followLead))}</p>
    <div class="grid g2"><div class="card"><h2>${esc(tr(UI.cmds))}</h2>
      <h3>${esc(tr(UI.cmdTests))}</h3>${cmdBlock(`${ENV} pytest ml/tests`)}
      <h3>${esc(tr(UI.cmdList))}</h3>${cmdBlock(`${ENV} neo-data list`)}
      <h3>${esc(tr(UI.cmdSplit))}</h3>${cmdBlock(`${ENV} neo-data split ham10000`)}
      <h3>${esc(tr(UI.cmdDash))}</h3>${cmdBlock(`${ENV} python tools/build_dashboard_m2.py`)}</div>
    <div class="card"><h2>${esc(tr(UI.history))}</h2>${commits}</div></div>`;
}

const RENDER = { overview: renderOverview, flow: renderFlow, code: renderCode, tests: renderTests, data: renderData, findings: renderFindings, follow: renderFollow };

/* ------------------------------------------------------------ shell */
function render() {
  document.documentElement.lang = lang;
  document.getElementById("brand-sub").textContent = tr(UI.brandSub);
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("tabs").innerHTML = VIEWS.map(v => `<button role="tab" data-view="${v}" aria-selected="${v === view}">${esc(tr(UI.tabs[v]))}</button>`).join("");
  const main = document.getElementById("main");
  main.innerHTML = FACTS && FACTS.code ? `<section class="view">${RENDER[view]()}</section>` : `<p class="note">${esc(tr(UI.noFacts))}</p>`;
  document.getElementById("footer").textContent = `${tr(UI.generated)} ${F.generated || "–"} · ${tr(UI.footer)}`;
}
function go(v, keepScroll) {
  if (!VIEWS.includes(v)) return;
  view = v;
  try { history.replaceState(null, "", "#" + v); } catch (e) { /* sandboxed viewers may block URL changes */ }
  render();
  if (!keepScroll) window.scrollTo({ top: 0, behavior: "smooth" });
}
function selectModule(name) {
  selectedModule = name;
  if (view !== "code") return go("code");
  render();
  const d = document.querySelector(".detail"); if (d) d.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

document.addEventListener("click", e => {
  const node = e.target.closest("[data-mod]");
  if (node) return selectModule(node.dataset.mod);
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.lang) { lang = t.dataset.lang; writeStore("neoHelperLang", lang); return render(); }
  if (t.id === "theme") {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; writeStore("neoHelperTheme", root.dataset.theme); return;
  }
  if (t.dataset.tfile) { testFilter = t.dataset.tfile; return go("tests"); }
  if (t.dataset.tfilter) { testFilter = t.dataset.tfilter; return go("tests", true); }
  if (t.dataset.copy) {
    const done = () => { t.textContent = tr(UI.copied); setTimeout(() => { t.textContent = tr(UI.copy); }, 1400); };
    try { navigator.clipboard.writeText(t.dataset.copy).then(done, () => {}); } catch (err) { /* clipboard may be blocked */ }
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("g[data-mod]")) { e.preventDefault(); selectModule(e.target.dataset.mod); }
});

(function init() {
  const params = new URLSearchParams(location.search);
  const stored = readStore("neoHelperLang");
  const nav = (navigator.language || "it").slice(0, 2);
  lang = ["it", "en", "es"].find(l => l === params.get("lang")) || ["it", "en", "es"].find(l => l === stored) || (["it", "en", "es"].includes(nav) ? nav : "it");
  const theme = readStore("neoHelperTheme");
  if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
  const hash = location.hash.replace("#", "");
  if (VIEWS.includes(hash)) view = hash;
  render();
})();
</script>
