# Project definition for the Neo Helper machine-learning code.
# `uv sync` reads this file, creates `ml/.venv` and writes exact versions to `uv.lock`.

[project]
name = "neo-helper"
version = "0.1.0"
description = "Neo Helper: data, frozen-backbone baselines and evaluation for dermoscopic lesion classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "scikit-learn>=1.5",
    "timm>=1.0",
    "torch>=2.5",
    "torchvision>=0.20",
]

# Tools needed to develop and test, not to run the pipeline.
[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.0",
    "ruff>=0.8",
]

# Command-line entry points: `uv run neo-check`.
[project.scripts]
neo-check = "neo.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
